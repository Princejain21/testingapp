format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
trigger_map:
- push_branch: main
  pipeline: primary_pipeline
- pull_request_source_branch: "*"
  pipeline: primary_pipeline

pipelines:
  primary_pipeline:
    stages:
    - build_stage: {}

stages:
  build_stage:
    workflows:
    - build_android: {}
    - build_ios: {}

workflows:
  build_android:
    meta:
      bitrise.io:
        stack: linux-docker-android-34
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Install Dependencies
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            npm install
    - react-native-android-build@4:
        inputs:
        - project_path: android
        - build_type: apk
        - variant: release
    - deploy-to-bitrise-io@2: {}

  build_ios:
    meta:
      bitrise.io:
        stack: osx-xcode-15.3.x
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Install Dependencies
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            npm install
    - cocoapods-install@2: {}
    - certificate-and-profile-installer@1: {}
    - xcode-archive@4:
        inputs:
        - project_path: ios/awesome.xcworkspace
        - scheme: awesome
        - export_method: ad-hoc
    - deploy-to-bitrise-io@2: {}
